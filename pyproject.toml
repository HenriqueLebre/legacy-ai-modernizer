[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legacy-ai-modernizer"
version = "0.1.0"
description = "AI agent that safely modernizes legacy Python code with validation and rollback"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["ai", "legacy-code", "refactoring", "modernization", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "langchain>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-core>=0.3.0",
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.7.0", "mypy>=1.13.0"]

[project.scripts]
modernizer = "modernizer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/modernizer"]

[tool.hatch.build.targets.sdist]
include = ["src/modernizer"]

[tool.hatch.build]
sources = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.pytest.ini_options]
testpaths = ["sample_legacy/tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.11"

